<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codexplore</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0c0e14; --bg-secondary: #13161e; --bg-tertiary: #1a1e2a;
  --bg-hover: #222738; --border: #2a2f40; --border-bright: #3a4060;
  --text-primary: #e2e6f0; --text-secondary: #8890a8; --text-muted: #585e74;
  --accent: #6c8cff; --accent-dim: #4a62b8; --accent-bg: rgba(108,140,255,0.08);
  --hot: #ff6b6b; --warm: #ffaa5c; --mild: #5cdb7a; --cold: #4a8fff;
  --font-mono: 'JetBrains Mono','Fira Code','SF Mono','Consolas',monospace;
  --font-sans: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius: 6px; --transition: 150ms ease;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
html, body { height: 100%; }
body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); overflow: hidden; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
#header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); gap: 16px; flex-shrink: 0; }
#header .logo { font-family: var(--font-mono); font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: -0.5px; white-space: nowrap; }
#header .logo span { color: var(--text-muted); font-weight: 400; }
#header .meta { font-size: 12px; color: var(--text-secondary); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
.controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.controls label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.controls select, .controls button { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 10px; font-size: 12px; font-family: var(--font-mono); cursor: pointer; outline: none; }
.controls select:hover, .controls button:hover { border-color: var(--border-bright); }
.toggle-btn { font-size: 11px; }
.toggle-btn.active { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
#main-wrapper { display: flex; overflow: hidden; height: 100%; }
#left-panels { display: flex; flex-direction: column; flex: 1; min-width: 300px; overflow: hidden; }
.panel { display: flex; flex-direction: column; overflow: hidden; min-height: 80px; }
.panel-header { display: flex; align-items: center; padding: 0 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); gap: 4px; flex-shrink: 0; min-height: 36px; }
.panel-header .tab { padding: 8px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); border-bottom: 2px solid var(--accent); user-select: none; }
.panel-header .spacer { flex: 1; }
.panel-header .info { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
.panel-body { flex: 1; overflow: auto; position: relative; }
.h-splitter { height: 5px; background: var(--bg-secondary); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: row-resize; flex-shrink: 0; }
.h-splitter:hover, .h-splitter.active { background: var(--accent-dim); }
.v-splitter { width: 5px; background: var(--bg-secondary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); cursor: col-resize; flex-shrink: 0; display: none; }
.v-splitter:hover, .v-splitter.active { background: var(--accent-dim); }
.v-splitter.visible { display: block; }
#flame-container { width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; position: relative; }
#flame-canvas { display: block; position: absolute; top: 0; left: 0; }
#flame-tooltip { position: fixed; background: var(--bg-tertiary); border: 1px solid var(--border-bright); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; font-family: var(--font-mono); pointer-events: none; z-index: 100; display: none; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
#flame-tooltip .fn-name { color: var(--accent); font-weight: 600; }
#flame-tooltip .fn-file { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
#flame-tooltip .fn-time { color: var(--warm); margin-top: 4px; }
#flame-tooltip .fn-hint { color: var(--text-muted); font-size: 10px; margin-top: 4px; }
#flame-zoom-indicator { position: absolute; top: 6px; left: 8px; display: flex; align-items: center; gap: 6px; z-index: 10; flex-wrap: wrap; }
#flame-zoom-indicator .bc { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 8px; cursor: pointer; }
#flame-zoom-indicator .bc:hover { color: var(--text-primary); border-color: var(--border-bright); }
#flame-zoom-indicator .bc.root { color: var(--accent); }
#fn-table-container { width: 100%; height: 100%; overflow: auto; }
.fn-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--font-mono); }
.fn-table thead { position: sticky; top: 0; z-index: 10; }
.fn-table th { background: var(--bg-tertiary); padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
.fn-table th:hover { color: var(--text-secondary); }
.fn-table th.sorted { color: var(--accent); }
.fn-table th.sorted::after { content: ' ▼'; font-size: 9px; }
.fn-table th.sorted.asc::after { content: ' ▲'; }
.fn-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fn-table tr { transition: background var(--transition); }
.fn-table tbody tr:hover { background: var(--bg-hover); cursor: pointer; }
.fn-table .col-self, .fn-table .col-total { text-align: right; font-variant-numeric: tabular-nums; }
.fn-table .col-name { max-width: 350px; color: var(--text-primary); }
.fn-table .col-file { max-width: 250px; color: var(--text-muted); font-size: 11px; }
.heat-bar { display: inline-block; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
#source-panel { display: none; flex-direction: column; background: var(--bg-primary); min-width: 250px; width: 450px; }
#source-panel.visible { display: flex; }
#source-panel .panel-header { justify-content: space-between; }
#source-panel .file-path { font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#source-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: var(--radius); line-height: 1; }
#source-close:hover { color: var(--text-primary); background: var(--bg-hover); }
#source-code { flex: 1; overflow: auto; padding: 8px 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; tab-size: 4; }
.source-line { display: flex; padding: 0 16px 0 0; min-height: 20px; transition: background 80ms ease; }
.source-line:hover { background: var(--bg-hover); }
.source-line.highlighted { background: rgba(108,140,255,0.15); }
.source-line.hot { background: rgba(255,107,107,0.12); }
.line-no { display: inline-block; width: 50px; text-align: right; padding-right: 16px; color: var(--text-muted); user-select: none; flex-shrink: 0; }
.line-heat { display: inline-block; width: 90px; text-align: right; padding-right: 12px; font-size: 10px; color: var(--warm); user-select: none; flex-shrink: 0; }
.line-content { white-space: pre; flex: 1; overflow: hidden; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); z-index: 1000; flex-direction: column; gap: 16px; }
#loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading .text { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
.search-input { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; font-size: 12px; font-family: var(--font-mono); color: var(--text-primary); outline: none; width: 200px; }
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="text">Loading profile…</div></div>
<div id="app" style="display:none">
  <div id="header">
    <div class="logo">codexplore <span>profiler</span></div>
    <div class="controls">
      <label>Thread</label>
      <select id="thread-select"></select>
      <button class="toggle-btn active" id="toggle-internals">Hide internals</button>
    </div>
    <div class="meta" id="header-meta"></div>
  </div>
  <div id="main-wrapper">
    <div id="left-panels">
      <div class="panel" id="panel-flame" style="flex:1">
        <div class="panel-header">
          <div class="tab">Flame Graph</div>
          <div class="spacer"></div>
          <input type="text" class="search-input" id="flame-search" placeholder="Filter functions…">
          <div class="info" id="flame-info"></div>
        </div>
        <div class="panel-body" id="flame-body">
          <div id="flame-container">
            <div id="flame-zoom-indicator"></div>
            <canvas id="flame-canvas"></canvas>
          </div>
        </div>
      </div>
      <div class="h-splitter" id="h-splitter"></div>
      <div class="panel" id="panel-table" style="flex:1">
        <div class="panel-header">
          <div class="tab">Functions</div>
          <div class="spacer"></div>
          <input type="text" class="search-input" id="table-search" placeholder="Search functions…">
          <div class="info" id="table-info"></div>
        </div>
        <div class="panel-body" id="fn-table-container">
          <table class="fn-table"><thead><tr>
            <th class="col-self sorted" data-sort="self">Self Time</th>
            <th class="col-total" data-sort="total">Total Time</th>
            <th class="col-self" data-sort="self-pct">Self %</th>
            <th class="col-total" data-sort="total-pct">Total %</th>
            <th class="col-name" data-sort="name">Function</th>
            <th class="col-file" data-sort="file">File</th>
          </tr></thead><tbody id="fn-table-body"></tbody></table>
        </div>
      </div>
    </div>
    <div class="v-splitter" id="v-splitter"></div>
    <div id="source-panel">
      <div class="panel-header">
        <span class="file-path" id="source-file-path">—</span>
        <button id="source-close" title="Close">✕</button>
      </div>
      <div class="panel-body" id="source-code"></div>
    </div>
  </div>
</div>
<div id="flame-tooltip"><div class="fn-name"></div><div class="fn-file"></div><div class="fn-time"></div><div class="fn-hint"></div></div>
<script>
(()=>{
"use strict";

let profileData,metaData,currentProfileIndex=0,processedFrames=[],flameRoot,
    sortColumn="self",sortAsc=false,searchTerm="",totalSamples=0,
    hideInternals=true,flameZoomStack=[],flameViewRoot=null;

// Viewport: horizontal zoom & pan for the flame graph
let vpZoom=1, vpPanX=0; // panX is in canvas pixels, zoom multiplies logical width

const INTERNAL_NAMES=new Set(["_call_with_frames_removed","_find_and_load","_find_and_load_unlocked",
  "_load_unlocked","_load","_gcd_import","_handle_fromlist","_bootstrap","_bootstrap_external","__import__"]);
const INTERNAL_FILE_RE=[/frozen/i,/importlib[\\/]_bootstrap/,/<frozen /];

function isInternal(n,f){
  if(INTERNAL_NAMES.has(n))return true;
  if(f)for(const r of INTERNAL_FILE_RE)if(r.test(f))return true;
  return false;
}
function skip(n,f){return hideInternals&&isInternal(n,f)}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function shortPath(p){if(!p)return"";const s=p.replace(/\\/g,"/").split("/");return s.length<=3?p:"…/"+s.slice(-3).join("/")}
function displayName(name,file){
  if(name==="<module>"&&file){const parts=file.replace(/\\/g,"/").split("/");const fn=parts[parts.length-1]||file;return`<module> (${fn})`}
  return name;
}
function fmtTime(v){
  if(Number.isInteger(v))return v+" samples";
  if(v>=60)return(v/60).toFixed(1)+"m";
  if(v>=1)return v.toFixed(2)+"s";
  return(v*1000).toFixed(1)+"ms";
}

async function loadData(){
  const[mr,pr]=await Promise.all([fetch("/api/meta"),fetch("/api/profile")]);
  metaData=await mr.json();profileData=await pr.json();
  document.getElementById("header-meta").textContent=`${metaData.script||"unknown"} · ${metaData.timestamp||""}`;
  populateThreadSelect();processProfile();resetZoom();renderAll();
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="";
}

function populateThreadSelect(){
  const sel=document.getElementById("thread-select");
  sel.innerHTML="";
  (profileData.profiles||[]).forEach((p,i)=>{
    const o=document.createElement("option");o.value=i;o.textContent=p.name||`Thread ${i}`;sel.appendChild(o);
  });
  sel.addEventListener("change",()=>{currentProfileIndex=+sel.value;processProfile();resetZoom();renderAll()});
}

function processProfile(){
  const prof=profileData.profiles[currentProfileIndex],sf=profileData.shared?.frames||[],
    samples=prof.samples||[],weights=prof.weights||samples.map(()=>1);
  totalSamples=weights.reduce((a,b)=>a+b,0);
  const fs=new Map();
  for(let si=0;si<samples.length;si++){
    const stk=samples[si],w=weights[si],seen=new Set();
    for(let fi=0;fi<stk.length;fi++){
      const idx=stk[fi],f=sf[idx]||{},nm=f.name||`<frame ${idx}>`,fl=f.file||"",dn=displayName(nm,fl);
      if(skip(nm,fl))continue;
      if(!fs.has(idx))fs.set(idx,{index:idx,self:0,total:0,name:dn,file:fl,line:f.line||0});
      if(!seen.has(idx)){fs.get(idx).total+=w;seen.add(idx)}
      if(fi===stk.length-1)fs.get(idx).self+=w;
    }
  }
  processedFrames=Array.from(fs.values());
  flameRoot=buildTree(samples,weights,sf);
}

function buildTree(samples,weights,sf){
  const root={name:"(root)",children:[],value:0,self:0,file:"",line:0,frameIndex:-1};
  for(let si=0;si<samples.length;si++){
    const stk=samples[si],w=weights[si];let node=root;root.value+=w;
    for(let fi=0;fi<stk.length;fi++){
      const idx=stk[fi],fr=sf[idx]||{},nm=fr.name||`<frame ${idx}>`,fl=fr.file||"",dn=displayName(nm,fl);
      if(skip(nm,fl))continue;
      let ch=node.children.find(c=>c.frameIndex===idx);
      if(!ch){ch={frameIndex:idx,name:dn,file:fl,line:fr.line||0,children:[],value:0,self:0};node.children.push(ch)}
      ch.value+=w;if(fi===stk.length-1)ch.self+=w;node=ch;
    }
  }
  return root;
}

function resetZoom(){flameZoomStack=[];flameViewRoot=flameRoot;vpZoom=1;vpPanX=0;updateBC()}
function zoomInto(n){if(!n||n===flameViewRoot)return;flameZoomStack.push(n);flameViewRoot=n;vpZoom=1;vpPanX=0;updateBC();renderFlame()}
function zoomTo(lv){
  if(lv<0)resetZoom();
  else{flameZoomStack=flameZoomStack.slice(0,lv+1);flameViewRoot=flameZoomStack[flameZoomStack.length-1]||flameRoot}
  updateBC();renderFlame();
}
function updateBC(){
  const el=document.getElementById("flame-zoom-indicator");
  if(!flameZoomStack.length){el.innerHTML="";return}
  let h=`<span class="bc root" data-lv="-1">⟵ root</span>`;
  flameZoomStack.forEach((n,i)=>{const l=n.name.length>25?n.name.slice(0,25)+"…":n.name;h+=`<span class="bc" data-lv="${i}">${esc(l)}</span>`});
  el.innerHTML=h;
  el.querySelectorAll(".bc").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();zoomTo(+b.dataset.lv)}));
}

function renderAll(){renderFlame();renderTable()}

const ROW_H=20,FONT_SZ=11;

function renderFlame(){
  const container=document.getElementById("flame-container"),canvas=document.getElementById("flame-canvas"),
    ctx=canvas.getContext("2d"),dpr=devicePixelRatio||1,root=flameViewRoot||flameRoot;
  const rects=[];let maxD=0;
  (function flat(nd,x,d){
    if(!nd.value)return;const w=nd.value/root.value;
    if(nd!==root){rects.push({node:nd,x,w,depth:d});maxD=Math.max(maxD,d)}
    let cx=x;[...nd.children].sort((a,b)=>b.value-a.value).forEach(c=>{flat(c,cx,d+1);cx+=c.value/root.value});
  })(root,0,0);

  const containerW=container.clientWidth,containerH=container.clientHeight;
  const ch=Math.max((maxD+2)*ROW_H,containerH);
  // Canvas is always container-sized; we apply zoom/pan during drawing
  canvas.width=containerW*dpr;canvas.height=ch*dpr;
  canvas.style.width=containerW+"px";canvas.style.height=ch+"px";
  ctx.scale(dpr,dpr);
  ctx.fillStyle="#0c0e14";ctx.fillRect(0,0,containerW,ch);

  const filt=searchTerm.toLowerCase();
  const logicalW=containerW*vpZoom; // total logical width

  for(const r of rects){
    const px=r.x*logicalW+vpPanX;
    const pw=r.w*logicalW;
    const py=(r.depth-1)*ROW_H;
    // Cull off-screen
    if(px+pw<0||px>containerW)continue;
    if(pw<0.5)continue;
    const sp=r.node.self/totalSamples,tp=r.node.value/totalSamples,dim=filt&&!r.node.name.toLowerCase().includes(filt);
    ctx.fillStyle=dim?"rgba(30,33,45,0.8)":heatC(sp,tp);
    ctx.fillRect(Math.max(px,0)+.5,py+.5,Math.min(pw,containerW)-1,ROW_H-1);
    if(pw>30&&!dim){
      ctx.fillStyle="#e2e6f0";ctx.font=FONT_SZ+"px JetBrains Mono,monospace";
      const labelX=Math.max(px+4,4);
      ctx.save();
      ctx.beginPath();ctx.rect(Math.max(px,0),py,Math.min(pw,containerW),ROW_H);ctx.clip();
      ctx.fillText(trunc(ctx,r.node.name,pw-8),labelX,py+14);
      ctx.restore();
    }
  }
  canvas._rects=rects;canvas._containerW=containerW;canvas._vr=root;
  const zoomPct=Math.round(vpZoom*100);
  document.getElementById("flame-info").textContent=`${fmtTime(totalSamples)} · ${processedFrames.length} frames`+(vpZoom>1.01?` · ${zoomPct}%`:"");
}

function heatC(s,t){return s>.15?"#e84040":s>.08?"#e86840":s>.03?"#d88840":s>.01?"#b89848":t>.3?"#5878a8":t>.1?"#486898":"#3a5080"}
function trunc(ctx,t,mw){if(ctx.measureText(t).width<=mw)return t;while(t.length&&ctx.measureText(t+"…").width>mw)t=t.slice(0,-1);return t+"…"}

function hit(mx,my){
  const canvas=document.getElementById("flame-canvas");
  const r=canvas._rects||[],cw=canvas._containerW||1;
  const logicalW=cw*vpZoom;
  for(const rc of r){
    const px=rc.x*logicalW+vpPanX;
    const pw=rc.w*logicalW;
    const py=(rc.depth-1)*ROW_H;
    if(mx>=px&&mx<=px+pw&&my>=py&&my<=py+ROW_H)return rc;
  }
  return null;
}

function clampPan(containerW){
  const logicalW=containerW*vpZoom;
  // Don't allow panning past edges
  if(vpPanX>0)vpPanX=0;
  if(vpPanX<containerW-logicalW)vpPanX=containerW-logicalW;
  if(vpZoom<=1){vpPanX=0;vpZoom=1}
}

function setupFlame(){
  const canvas=document.getElementById("flame-canvas"),tt=document.getElementById("flame-tooltip");
  const container=document.getElementById("flame-container");

  // ── Wheel / pinch zoom (horizontal) ────────────────
  container.addEventListener("wheel",e=>{
    e.preventDefault();
    const rect=container.getBoundingClientRect();
    const mx=e.clientX-rect.left; // mouse x in container

    // ctrlKey is set for pinch-to-zoom on trackpads
    if(e.ctrlKey||Math.abs(e.deltaX)<Math.abs(e.deltaY)){
      // Zoom
      const delta=e.ctrlKey?-e.deltaY*0.02:-e.deltaY*0.005;
      const oldZoom=vpZoom;
      vpZoom=Math.max(1,Math.min(vpZoom*Math.exp(delta),200));
      // Zoom toward mouse position
      const logicalMouseBefore=(mx-vpPanX)/oldZoom;
      vpPanX=mx-logicalMouseBefore*vpZoom;
    } else {
      // Horizontal scroll → pan
      vpPanX-=e.deltaX;
    }
    clampPan(container.clientWidth);
    renderFlame();
  },{passive:false});

  // ── Drag to pan ────────────────────────────────────
  let dragging=false,dragStartX=0,dragStartPan=0;
  container.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    // Only start drag if zoomed in
    if(vpZoom<=1.01)return;
    dragging=true;dragStartX=e.clientX;dragStartPan=vpPanX;
    container.style.cursor="grabbing";
    e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{
    if(!dragging)return;
    vpPanX=dragStartPan+(e.clientX-dragStartX);
    clampPan(container.clientWidth);
    renderFlame();
  });
  document.addEventListener("mouseup",()=>{
    if(dragging){dragging=false;container.style.cursor=""}
  });

  canvas.addEventListener("mousemove",e=>{
    if(dragging)return;
    const rect=canvas.getBoundingClientRect(),h=hit(e.clientX-rect.left,e.clientY-rect.top);
    if(h){
      const n=h.node,vr=canvas._vr||flameRoot,sp=((n.self/totalSamples)*100).toFixed(1),tp=((n.value/totalSamples)*100).toFixed(1),lp=((n.value/vr.value)*100).toFixed(1);
      tt.querySelector(".fn-name").textContent=n.name;
      tt.querySelector(".fn-file").textContent=n.file?shortPath(n.file)+":"+n.line:"";
      tt.querySelector(".fn-time").textContent=`self: ${sp}% (${fmtTime(n.self)}) · total: ${tp}% (${fmtTime(n.value)})`+(flameZoomStack.length?` · local: ${lp}%`:"");
      tt.querySelector(".fn-hint").textContent=n.children.length?"Click=zoom into · Right-click=source · Scroll/pinch=zoom · Drag=pan":"Click=source";
      tt.style.display="block";tt.style.left=(e.clientX+12)+"px";tt.style.top=(e.clientY-10)+"px";
      const tr=tt.getBoundingClientRect();
      if(tr.right>innerWidth)tt.style.left=(e.clientX-tr.width-12)+"px";
      if(tr.bottom>innerHeight)tt.style.top=(e.clientY-tr.height-10)+"px";
      canvas.style.cursor="pointer";
    }else{tt.style.display="none";canvas.style.cursor=vpZoom>1.01?"grab":"default"}
  });
  canvas.addEventListener("mouseleave",()=>{tt.style.display="none"});
  let clickStartX=0,clickStartY=0;
  canvas.addEventListener("mousedown",e=>{clickStartX=e.clientX;clickStartY=e.clientY});
  canvas.addEventListener("click",e=>{
    // Ignore if this was a drag
    if(Math.abs(e.clientX-clickStartX)>4||Math.abs(e.clientY-clickStartY)>4)return;
    const rect=canvas.getBoundingClientRect(),h2=hit(e.clientX-rect.left,e.clientY-rect.top);
    if(!h2)return;
    if(h2.node.children.length)zoomInto(h2.node);else if(h2.node.file)openSource(h2.node.file,h2.node.line);
  });
  canvas.addEventListener("contextmenu",e=>{
    const rect=canvas.getBoundingClientRect(),h2=hit(e.clientX-rect.left,e.clientY-rect.top);
    if(h2&&h2.node.file){e.preventDefault();openSource(h2.node.file,h2.node.line)}
  });
  canvas.addEventListener("dblclick",e=>{e.preventDefault();if(flameZoomStack.length)zoomTo(flameZoomStack.length-2)});
}

function renderTable(){
  const tbody=document.getElementById("fn-table-body"),filt=document.getElementById("table-search").value.toLowerCase();
  let fr=[...processedFrames];
  if(filt)fr=fr.filter(f=>f.name.toLowerCase().includes(filt)||f.file.toLowerCase().includes(filt));
  fr.sort((a,b)=>{let va,vb;switch(sortColumn){case"self":case"self-pct":va=a.self;vb=b.self;break;case"total":case"total-pct":va=a.total;vb=b.total;break;case"name":va=a.name;vb=b.name;break;case"file":va=a.file;vb=b.file;break;default:va=a.self;vb=b.self}return typeof va==="string"?(sortAsc?va.localeCompare(vb):vb.localeCompare(va)):(sortAsc?va-vb:vb-va)});
  const mx=Math.max(...fr.map(f=>f.self),1);
  tbody.innerHTML=fr.map(f=>{
    const sp=((f.self/totalSamples)*100).toFixed(1),tp=((f.total/totalSamples)*100).toFixed(1),hw=Math.max((f.self/mx)*60,2),
      hc=f.self/totalSamples>.1?"var(--hot)":f.self/totalSamples>.03?"var(--warm)":f.self/totalSamples>.005?"var(--mild)":"var(--cold)";
    return`<tr data-file="${esc(f.file)}" data-line="${f.line}"><td class="col-self"><span class="heat-bar" style="width:${hw}px;background:${hc}"></span>${fmtTime(f.self)}</td><td class="col-total">${fmtTime(f.total)}</td><td class="col-self">${sp}%</td><td class="col-total">${tp}%</td><td class="col-name" title="${esc(f.name)}">${esc(f.name)}</td><td class="col-file" title="${esc(f.file)}:${f.line}">${shortPath(f.file)}:${f.line}</td></tr>`
  }).join("");
  document.getElementById("table-info").textContent=`${fr.length} function${fr.length!==1?"s":""}`;
}

function setupTable(){
  document.querySelectorAll(".fn-table th[data-sort]").forEach(th=>{
    th.addEventListener("click",()=>{
      const c=th.dataset.sort;if(sortColumn===c)sortAsc=!sortAsc;else{sortColumn=c;sortAsc=false}
      document.querySelectorAll(".fn-table th").forEach(h=>h.classList.remove("sorted","asc"));
      th.classList.add("sorted");if(sortAsc)th.classList.add("asc");renderTable();
    });
  });
  document.getElementById("fn-table-body").addEventListener("click",e=>{const tr=e.target.closest("tr");if(tr&&tr.dataset.file)openSource(tr.dataset.file,+(tr.dataset.line)||0)});
  document.getElementById("table-search").addEventListener("input",renderTable);
  document.getElementById("flame-search").addEventListener("input",e=>{searchTerm=e.target.value;renderFlame()});
}

function setupInternals(){
  const btn=document.getElementById("toggle-internals");
  btn.addEventListener("click",()=>{
    hideInternals=!hideInternals;btn.textContent=hideInternals?"Hide internals":"Show internals";
    btn.classList.toggle("active",hideInternals);processProfile();resetZoom();renderAll();
  });
}

async function openSource(fp,line){
  const panel=document.getElementById("source-panel"),spl=document.getElementById("v-splitter"),
    code=document.getElementById("source-code"),pathEl=document.getElementById("source-file-path");
  panel.classList.add("visible");spl.classList.add("visible");
  pathEl.textContent=shortPath(fp);pathEl.title=fp;
  code.innerHTML='<div style="padding:20px;color:var(--text-muted)">Loading…</div>';
  try{
    const res=await fetch(`/api/source?path=${encodeURIComponent(fp)}`),data=await res.json();
    if(data.error){code.innerHTML=`<div style="padding:20px;color:var(--hot)">${esc(data.error)}</div>`;return}
    const lh={};for(const f of processedFrames)if(f.file===fp&&f.line>0)lh[f.line]=(lh[f.line]||0)+f.self;
    const lines=data.content.split("\n"),sl=data.start_line||1;
    code.innerHTML=lines.map((lc,i)=>{
      const ln=sl+i,heat=lh[ln]||0,hp=heat/totalSamples*100;
      let cls="source-line";if(ln===line)cls+=" highlighted";if(hp>1)cls+=" hot";
      return`<div class="${cls}"><span class="line-no">${ln}</span><span class="line-heat">${heat>0?hp.toFixed(1)+"% ("+fmtTime(heat)+")":""}</span><span class="line-content">${esc(lc)}</span></div>`;
    }).join("");
    requestAnimationFrame(()=>{const t=code.querySelector(".highlighted");if(t)t.scrollIntoView({block:"center",behavior:"smooth"})});
  }catch(err){code.innerHTML=`<div style="padding:20px;color:var(--hot)">Failed: ${esc(err.message)}</div>`}
  // re-render flame since panel width changed
  setTimeout(renderFlame,50);
}

function setupSource(){
  document.getElementById("source-close").addEventListener("click",()=>{
    document.getElementById("source-panel").classList.remove("visible");
    document.getElementById("v-splitter").classList.remove("visible");
    setTimeout(renderFlame,50);
  });
}

function setupSplitters(){
  const hSpl=document.getElementById("h-splitter"),pF=document.getElementById("panel-flame"),pT=document.getElementById("panel-table");
  const vSpl=document.getElementById("v-splitter"),srcP=document.getElementById("source-panel"),leftP=document.getElementById("left-panels");
  let hDrag=false,vDrag=false;

  hSpl.addEventListener("mousedown",e=>{e.preventDefault();hDrag=true;hSpl.classList.add("active");document.body.style.cursor="row-resize";document.body.style.userSelect="none"});
  vSpl.addEventListener("mousedown",e=>{e.preventDefault();vDrag=true;vSpl.classList.add("active");document.body.style.cursor="col-resize";document.body.style.userSelect="none"});

  document.addEventListener("mousemove",e=>{
    if(hDrag){
      const r=leftP.getBoundingClientRect(),y=e.clientY-r.top,tot=r.height-5,fh=Math.max(80,Math.min(y,tot-80));
      pF.style.flex="none";pF.style.height=fh+"px";pT.style.flex="none";pT.style.height=(tot-fh)+"px";renderFlame();
    }
    if(vDrag){
      const wr=document.getElementById("main-wrapper").getBoundingClientRect(),x=e.clientX-wr.left,tot=wr.width-5,lw=Math.max(300,Math.min(x,tot-250));
      leftP.style.flex="none";leftP.style.width=lw+"px";srcP.style.width=(tot-lw)+"px";renderFlame();
    }
  });

  document.addEventListener("mouseup",()=>{
    if(hDrag){hDrag=false;hSpl.classList.remove("active");document.body.style.cursor="";document.body.style.userSelect=""}
    if(vDrag){vDrag=false;vSpl.classList.remove("active");document.body.style.cursor="";document.body.style.userSelect=""}
  });
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    const sp=document.getElementById("source-panel");
    if(sp.classList.contains("visible")){sp.classList.remove("visible");document.getElementById("v-splitter").classList.remove("visible");setTimeout(renderFlame,50)}
    else if(flameZoomStack.length){resetZoom();renderFlame()}
  }
  if(e.key==="Backspace"&&!e.target.matches("input,textarea")&&flameZoomStack.length)zoomTo(flameZoomStack.length-2);
});

let resizeT;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(flameRoot)renderFlame()},150)});

document.addEventListener("DOMContentLoaded",()=>{setupFlame();setupTable();setupSource();setupSplitters();setupInternals();loadData()});
})();
</script>
</body>
</html>
